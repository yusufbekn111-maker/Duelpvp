name: Build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          set -o pipefail
          mvn -B package 2>&1 | tee build.log
      - name: Save errors
        if: failure()
        run: |
          grep -E "ERROR|error:" build.log | head -40 > errors.txt
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add errors.txt
          git commit -m "Build errors"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: duelpvp
          path: target/duelpvp.jar
